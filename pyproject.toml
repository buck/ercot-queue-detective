[project]
name = "ercot-queue-detective"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyarrow>=16.0",
    "requests>=2.32",
    "python-dateutil>=2.9",
    "datasette>=0.65",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipython>=8.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ipython>=8.0",
]
